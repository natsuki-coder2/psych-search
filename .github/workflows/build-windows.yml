name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.2

      - name: Install haxelib dependencies
        run: |
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-tools 1.5.1 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hxCodec 2.6.1 --quiet
          haxelib install SScript --quiet
          haxelib install hxcpp-debug-server 1.2.4 --quiet
          haxelib install tjson --quiet
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit master

      - name: Setup Lime
        run: haxelib run lime setup -y

      - name: Build Windows executable
        run: haxelib run lime build windows -final

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: psych-engine-windows-build
          path: export/release/windows/bin/
